<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#08090d"><title>CAMO//FORGE — Meta Waffen</title>
<style>
:root{--bg:#08090d;--line:#282b37;--text:#f4f5f8;--muted:#9a9eae;--pink:#ff35d3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#30203b 0,transparent 52%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(800px,calc(100% - 28px));margin:auto;padding:22px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:950;letter-spacing:.06em}.brand span{color:var(--pink)}a{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:4px;font-size:12px}.panel{margin:70px auto 0;text-align:center;padding:clamp(25px,7vw,58px) 18px;border:1px solid #5b2856;border-radius:10px;background:linear-gradient(145deg,#17131d,#0d0f15);box-shadow:0 0 50px #ff35d30b}.tag{color:var(--pink);font-size:10px;letter-spacing:.25em;font-weight:900}.icon{font-size:58px;color:var(--pink);margin:24px 0 10px}.panel h1{font-size:clamp(32px,7vw,56px);margin:0 0 14px;letter-spacing:-.05em}.panel p{color:var(--muted);line-height:1.7;max-width:500px;margin:0 auto 25px;font-size:14px}.badge{display:inline-block;color:var(--pink);border:1px solid var(--pink);padding:10px 14px;font-size:11px;font-weight:900;letter-spacing:.14em;border-radius:3px}footer{text-align:center;margin-top:28px;color:#696e7f;font-size:10px;letter-spacing:.13em}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand">CAMO<span>//</span>FORGE</div><a href="../">← Startseite</a></div><main class="panel"><div class="tag">META INTEL / IN DEVELOPMENT</div><div class="icon">⌁</div><h1>COMING SOON</h1><p>Der Meta-Waffen-Bereich wird gerade vorbereitet. Hier folgen nach und nach aktuelle Meta-Builds, Waffen-Tiers und Loadouts.</p><span class="badge">UNDER CONSTRUCTION</span></main><footer>CAMO//FORGE · META WEAPONS</footer></div><style>#cf-lang{display:flex;gap:5px;align-items:center;justify-content:center;position:fixed;z-index:99999;top:10px;right:10px;padding:5px;background:#101218;border:1px solid #424653;border-radius:999px}#cf-lang button{border:0;border-radius:999px;padding:7px 10px;background:transparent;color:#ddd;font-weight:800}#cf-lang button.active{background:#f5d328;color:#08090d}</style><div id="cf-lang" aria-label="Language"><button data-l="de">🇩🇪 DE</button><button data-l="en">🇬🇧 EN</button></div><script>(function(){const pairs=[["← Startseite", "← Home"], ["Der Meta-Waffen-Bereich wird gerade vorbereitet. Hier folgen nach und nach aktuelle Meta-Builds, Waffen-Tiers und Loadouts.", "The meta weapons section is being prepared. Current meta builds, weapon tiers, and loadouts will be added here over time."], ["UNDER CONSTRUCTION", "IN ARBEIT"], ["META WEAPONS", "META-WAFFEN"]];let lang=localStorage.getItem('camoforge-language')||'de';function apply(){document.documentElement.lang=lang;document.querySelectorAll('#cf-lang button').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));const from=lang==='en'?pairs.map(x=>[x[0],x[1]]):pairs.map(x=>[x[1],x[0]]);const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(n.parentElement.closest('#cf-lang,script,style'))continue;let t=n.nodeValue;for(const [a,b] of from){if(t.includes(a))t=t.split(a).join(b)}n.nodeValue=t}}document.querySelectorAll('#cf-lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;localStorage.setItem('camoforge-language',lang);location.reload()}));apply()})();</script></body></html>
